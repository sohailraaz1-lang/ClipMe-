<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ClipMe</title>
<style>
:root{--bg:#F6F7FB;--card:#fff;--bd:#E8EAF2;--tx:#111827;--mu:#6B7280;--pu:#5B46F6;--pt:#F2F0FF;--rd:#EF4444;--rt:#FEF2F2;--gn:#10B981;--gt:#ECFDF5;--am:#F59E0B;--at:#FFFBEB;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1020;--card:#191A2E;--bd:#2A2C48;--tx:#F3F4F8;--mu:#9CA3AF;--pt:#26225A;--rt:#3A1A20;--gt:#0F2E25;--at:#3A2D0E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1020;--card:#191A2E;--bd:#2A2C48;--tx:#F3F4F8;--mu:#9CA3AF;--pt:#26225A;--rt:#3A1A20;--gt:#0F2E25;--at:#3A2D0E;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 "Plus Jakarta Sans",Inter,system-ui,sans-serif;max-width:520px;margin:0 auto;padding:0 14px 90px}
.bar{display:flex;align-items:center;gap:10px;padding:14px 0}.logo{width:38px;height:38px;border-radius:11px;background:var(--rd);color:#fff;display:grid;place-items:center;font-size:18px}
.ttl{font-weight:800;font-size:18px;line-height:1}.by{font-size:9px;font-weight:700;color:var(--rd);background:var(--rt);padding:1px 6px;border-radius:6px;display:inline-block;margin-top:3px}
.sp{flex:1}.ib{position:relative;border:1px solid var(--bd);background:var(--card);border-radius:12px;width:38px;height:38px;font-size:17px;cursor:pointer;color:var(--tx)}
.bd{position:absolute;top:-5px;right:-5px;background:var(--pu);color:#fff;font-size:10px;border-radius:9px;padding:0 5px}
.pro{border:1.5px solid var(--am);color:var(--am);background:none;border-radius:20px;padding:8px 12px;font-weight:700;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bd);padding:4px;border-radius:14px;margin-bottom:10px}
.seg button{border:1.5px solid transparent;background:none;border-radius:11px;padding:10px;font-weight:700;color:var(--mu);cursor:pointer;font:inherit;font-weight:700}
.seg .on{background:var(--card);border-color:var(--pu);color:var(--pu)}.seg .on.l{border-color:var(--rd);color:var(--rd)}
.sub{color:var(--mu);margin:0 0 12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(17,24,39,.05)}
.card.live{border-color:#FECACA}.row{display:flex;align-items:center;gap:10px}.row h3{margin:0;font-size:15px}.row small{color:var(--mu);display:block;font-size:12.5px}
.ic{width:34px;height:34px;border-radius:10px;background:var(--pt);display:grid;place-items:center}
.tg{width:46px;height:26px;border-radius:13px;border:0;background:var(--bd);position:relative;cursor:pointer;flex:none;transition:background .2s}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:var(--pu)}.tg.on:after{left:23px}.tg.g.on{background:var(--gn)}.tg.a.on{background:var(--am)}
.body{margin-top:12px}input[type=text]{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px;font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}
.ch{flex:none;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}
.ch.on{border-color:var(--pu);background:var(--pt);color:var(--pu)}.ch.l.on{border-color:var(--rd);background:var(--rt);color:var(--rd)}
.grid{display:grid;gap:6px}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5 .ch,.g4 .ch{padding:9px 2px;font-size:12px;text-align:center}
.cap{flex:none;width:130px;height:76px;border-radius:12px;background:#1b1b24;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;border:2px solid transparent;cursor:pointer}.cap.on{border-color:var(--pu)}
.pill{display:inline-block;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:700;background:var(--gt);color:var(--gn)}
.note{background:var(--pt);color:var(--pu);border-radius:12px;padding:10px;font-weight:600;font-size:13px}
.cta{position:sticky;bottom:10px;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;color:#fff;background:var(--pu);cursor:pointer;margin:6px 0 12px}.cta.off{background:#9CA3AF}.cta.l{background:var(--rd)}.cta.g{background:var(--gn)}
.out{width:100%;border:1.5px solid var(--rd);color:var(--rd);background:none;border-radius:14px;padding:13px;font:inherit;font-weight:700;margin-bottom:12px;cursor:pointer}
.frame{aspect-ratio:9/16;max-width:150px;margin:8px auto;border-radius:12px;background:#222;position:relative;overflow:hidden;display:flex;flex-direction:column}
.frame div{flex:1;display:grid;place-items:center;color:#fff;font-size:11px}.frame .seam{flex:none;height:3px;background:#fff}
.frame b{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#FACC15;font-size:12px;text-shadow:0 1px 3px #000}
.sc{font-weight:800;border-radius:10px;padding:4px 9px;background:var(--at);color:var(--am);font-size:12px}
.btn{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:11px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}
.btn.r{border-color:var(--rd);color:var(--rd)}.btn.gn{background:var(--gn);border-color:var(--gn);color:#fff}
.prog{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--pu);transition:width .3s}
.stat{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--mu)}.stat b{display:block;color:var(--tx);font-size:14px}
.tab{display:flex;gap:6px;align-items:center}.back{border:0;background:none;font-size:22px;color:var(--tx);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#111827;color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;z-index:9;max-width:90%;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:8;padding:20px}.modal .card{max-width:380px}
.fab{position:fixed;right:max(14px,calc(50% - 246px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--pu);color:#fff;border:0;border-radius:26px;padding:14px 18px;font:inherit;font-weight:800;cursor:pointer}
.nw{font-size:10px;font-weight:800;background:var(--am);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
</style></head><body><div id="app"></div><div id="t"></div>
<script>
const CL=[["Last-second clutch steals the round","01:14:20 – 01:15:20","🔥 6.2% Chat Spike",94,"Peak chat burst and crowd noise"],["Streamer loses it after jump scare","00:48:05 – 00:48:35","😱 Facecam: Shocked",88,"Strong facial reaction, clear audio"],["Chat spams LOL over fail","02:03:10 – 02:03:40","😂 Funny Scene",81,"Laugh emotes spike 4x"],["1v4 fight ends in a draw","00:22:40 – 00:23:00","🥊 Fight Detected",76,"Motion and audio spike"]];
const MOD=[[["Phi-3 Mini (Fast)","~400 MB",1],["Gemma 2 2B (Recommended)","~1.5 GB",0],["Llama 3.2 3B (High Quality)","~2 GB",0]],[["Vosk Indian English","~36 MB",1],["Vosk Hindi & Regional","~42 MB",0],["Vosk Global English","~40 MB",0]]];
const S={tab:"n",scr:"home",url:"",ai:1,cap:1,cs:0,hook:0,ht:"",n:3,len:"20s",fmt:"v",lay:"Auto",rev:1,auto:1,dur:"Auto",th:5,fi:1,fu:1,fa:1,lang:"English",music:0,viral:1,mt:0,pct:0,help:0,swap:0,etxt:"Heyy here please",ey:50,esz:22,ecol:"#FFFFFF",etab:"Text",br:0,ct:0,zm:100,st:CL.map(()=>0),mod:MOD.map(a=>a.map(m=>m[2]))};
let tm,iv;const $=q=>document.querySelector(q);
function toast(m){clearTimeout(tm);$("#t").innerHTML='<div class="toast">'+m+'</div>';tm=setTimeout(()=>$("#t").innerHTML="",2200)}
const tg=(k,c="")=>`<button class="tg ${c} ${S[k]?"on":""}" data-a="t" data-k="${k}" aria-label="toggle"></button>`;
const ch=(k,l,v,c="")=>`<button class="ch ${c} ${S[k]===v?"on":""}" data-a="s" data-k="${k}" data-v="${v}">${l}</button>`;
const head=(i,t,s,x="")=>`<div class="row"><div class="ic">${i}</div><div style="flex:1"><h3>${t}</h3><small>${s}</small></div>${x}</div>`;
const lenCta=()=>S.tab=="n"?`Scan &amp; Preview ${S.n} Clip${S.n>1?"s":""} (${S.len})`:"Start Monitoring Live Chat";
function layout(){return`<div class="card">${head("▦","Layout","Choose how 9:16 clips are framed",'<button class="btn" data-a="help">? Help</button>')}<div class="body"><div class="chips">${["Auto","Set it myself","Full frame"].map(x=>ch("lay",x+(x=="Auto"?" (Recommended)":""),x)).join("")}</div>
${S.lay=="Auto"?`<div class="frame"><div>Gameplay</div><i class="seam"></i><div>Facecam</div><b>VIRAL MOMENT</b></div><small style="color:var(--mu)">50/50 split with captions on the centre seam.</small>`:S.lay=="Full frame"?`<div class="frame"><div style="background:#444">Person, cropped vertically</div></div>`:`<div class="frame" style="max-width:230px;aspect-ratio:16/9;flex-direction:row"><div style="border:3px solid #FACC15;margin:8px">Game box</div><div style="border:3px solid #EC4899;margin:8px">You</div></div><button class="btn" data-a="swap">⇅ Swap</button> <small style="color:var(--mu)">${S.swap?"Streamer on top":"Streamer on bottom"}. Applies to every clip from this link.</small>`}</div></div>`}
function captions(){return`<div class="card">${head("CC","Dynamic Auto-Captions","Word-by-word on-device subtitles",tg("cap"))}${S.cap?`<div class="body"><div class="chips">${[["Viral Yellow","VIRAL MOMENT","#FACC15"],["Neon Cyan","NEXT LEVEL","#22D3EE"],["High Energy Lime","INSANE REACTION","#A3E635"],["Sunset Amber","MUST WATCH","#FB923C"]].map((c,i)=>`<div class="cap ${S.cs==i?"on":""}" style="color:${c[2]}" data-a="s" data-k="cs" data-v="${i}">${c[1]}</div>`).join("")}</div>
<p style="margin:10px 0 6px;font-weight:700">Caption language<span class="nw">NEW</span></p><div class="chips">${["English","Hindi","Hinglish"].map(x=>ch("lang",x,x)).join("")}</div><div style="margin-top:10px"><span class="pill">Offline Vosk Speech Tool Installed (50MB)</span></div></div>`:""}</div>`}
function hook(){return`<div class="card">${head("T","Hook Title Header","Viral text on top area",tg("hook"))}${S.hook?`<div class="body"><div class="note">AI Auto-Hook Active: LLM generates custom viral hooks per clip</div><div class="chips" style="margin:10px 0">${["WAIT FOR IT! 😱🔥","HE DID NOT EXPECT THIS! 😂💀","INSTANT KARMA! 🤯","UNREAL 1000 IQ PLAY! 🔥","MUST WATCH TILL END! 🔥🎬"].map(x=>ch("ht",x,x)).join("")}</div><input type="text" placeholder="Or type your own hook" value="${S.ht}" data-a="in" data-k="ht"></div>`:""}</div>`}
function extras(){return`<div class="card">${head("★","New: Creator Extras","Added on top of the original",'<span class="nw">NEW</span>')}<div class="body"><div class="row" style="margin-bottom:10px"><div style="flex:1"><b>Viral Score (0–100)</b><small style="color:var(--mu)">Rank every clip and explain why</small></div>${tg("viral")}</div><div class="row"><div style="flex:1"><b>Auto Background Music</b><small style="color:var(--mu)">Beat-matched, copyright-safe</small></div>${tg("music","g")}</div></div></div>`}
function home(){const L=S.tab=="l",v=S.url.length>6||S.file;
return`<div class="bar"><div class="logo">▶</div><div><div class="ttl">ClipMe</div></div><div class="sp"></div><button class="ib" data-a="go" data-v="lib" aria-label="My clips">🎞</button><button class="ib" data-a="go" data-v="mod" aria-label="AI models">🧠<span class="bd">4</span></button></div>
<div class="seg"><button class="${!L?"on":""}" data-a="s" data-k="tab" data-v="n">🎬 Normal Video</button><button class="${L?"on l":""}" data-a="s" data-k="tab" data-v="l">📡 Live Stream</button></div>
<p class="sub">${L?"Auto-detect fights, funny moments, facecam reactions, and 5%+ viewer chat spikes in real time.":"Turn long online video streams into viral clips automatically."}</p>
<div class="card ${L?"live":""}">${head(L?"🔴":"🔗",L?"Live Stream Link":"Video Stream URL","")}<div class="body row"><input type="text" id="url" placeholder="${L?"Paste live stream link here...":"Paste video or stream link here..."}" value="${S.url}" data-a="in" data-k="url"><button class="ib" data-a="paste" aria-label="Paste">📋</button></div></div>
${L?`<div class="card">${head("✨","Auto-Clip on Hype Spikes","Starts 10s before peak moment &amp; queues for preview",tg("auto","a"))}${S.auto?`<div class="body"><div class="chips">${["10s (Short)","20s (Reel)","30s (Viral)","60s (Full)","Auto"].map(x=>ch("dur",x,x)).join("")}</div>
<p style="margin:12px 0 6px;font-weight:700">Chat Hype Trigger (% of Live Viewers)</p><div class="row"><button class="btn" data-a="th" data-v="-1">−</button><b style="flex:1;text-align:center;color:var(--am);font-size:20px">${S.th}%</b><button class="btn" data-a="th" data-v="1">+</button></div><small style="color:var(--mu)">Triggers when ≥ ${S.th}% of viewers comment in a burst (${S.th*10}+ comments for 1,000 viewers).</small>
<div class="chips" style="margin-top:12px">${[["fi","🥊 Fight / Action"],["fu","😂 Funny"],["fa","😱 Face Check"]].map(x=>`<button class="ch ${S[x[0]]?"on":""}" data-a="t" data-k="${x[0]}">${x[1]}</button>`).join("")}</div></div>`:""}</div>
<div class="card">${head("✔","Review Before Rendering","Pass or Reject clips first",tg("rev","g"))}</div>`:
`<div class="card">${head("🧠","AI Viral Analysis",S.ai?"Use on-device LLM model":"Using fast community highlight",tg("ai"))}${S.ai?`<div class="body"><div class="row ch on" style="width:100%" data-a="go" data-v="mod">● <div style="flex:1"><b>Phi-3 Mini (Fast)</b><small style="color:var(--mu)">~400 MB • On-Device GGUF</small></div>✓</div></div>`:""}</div>`}
${brain()}${captions()}${hook()}
${L?"":`<div class="card"><b>Number of Viral Clips</b><div class="grid g5" style="margin-top:8px">${[1,2,3,4,5].map(x=>ch("n",x+(x>1?" Clips":" Clip"),x)).join("")}</div></div>
<div class="card"><b>Clip Length</b><div class="grid g4" style="margin-top:8px">${["20s / Fast","30s / Viral","40s / Story","60s / Full"].map(x=>ch("len",x,x.split(" ")[0])).join("")}</div></div>`}
<div class="card"><b>Output Format</b><div class="chips" style="margin-top:8px">${ch("fmt","Vertical Shorts / Reels (9:16)","v")}${ch("fmt","Landscape (16:9)","h")}</div></div>
${S.fmt=="v"?layout():""}${extras()}
${L?"":`<div class="card">${head("✔","Review Before Rendering","Preview clips to Pass or Reject before final export (saves rendering time)",tg("rev","g"))}</div>`}
${L?`<button class="cta l" data-a="scan">Record 5 min &amp; find clips</button>`:`<button class="cta ${v?"":"off"}" id="cta" data-a="scan">${lenCta()}</button>`}

`}
function rev(){const a=S.st.filter(x=>x==1).length,r=S.st.filter(x=>x==2).length;
return`<div class="bar"><button class="back" data-a="go" data-v="home">←</button><div><div class="ttl">Review Detected Clips</div><small style="color:var(--mu)">Approve clips to render • Reject to skip</small></div></div>
<div class="row" style="margin-bottom:12px"><span class="stat"><b>${S.st.length-a-r}</b>Pending</span><span class="stat"><b style="color:var(--gn)">${a}</b>Approved</span><span class="stat"><b style="color:var(--rd)">${r}</b>Rejected</span></div>
${CL.map((c,i)=>`<div class="card" style="${S.st[i]==1?"border-color:var(--gn)":S.st[i]==2?"opacity:.55":""}"><div class="row" style="align-items:flex-start"><div class="frame" style="width:70px;margin:0;flex:none"><div>▶</div><i class="seam"></i><div></div><b style="font-size:8px">WORD</b></div><div style="flex:1"><b>${c[0]}</b><div style="margin:6px 0"><span class="pill">${c[2]}</span></div><small style="color:var(--mu)">${c[1]}</small></div></div>
${S.viral?`<div class="row" style="margin-top:8px"><span class="sc">Viral score ${c[3]}</span><small style="color:var(--mu)">${c[4]}</small></div>`:""}
<div class="row" style="margin-top:10px"><button class="btn r" style="flex:1" data-a="st" data-i="${i}" data-v="2">✕ Reject</button><button class="btn gn" style="flex:1" data-a="st" data-i="${i}" data-v="1">✓ Approve</button></div></div>`).join("")}
<button class="cta ${a?"g":"off"}" data-a="render">Render Approved Clips (${a})</button>`}
function prog(){const p=S.pct,eta=Math.max(0,Math.round((100-p)*.9)),st=["Stream Fetch &amp; Audio Extract","AI Viral, Fight &amp; Facecam Scan","Vosk Auto-Captions Generation","FFmpeg Split &amp; Seam Subtitle Burn-in"],th=[25,50,75,100];
return`<div class="bar"><div class="ttl">Processing Clips...</div><div class="sp"></div><button class="btn" data-a="go" data-v="home">Minimize</button></div>
<div class="card"><div class="row"><b style="color:var(--pu);font-size:22px">${p}% Done</b><div class="sp"></div><span style="color:var(--mu)">${100-p}% Left</span></div><div class="prog"><i style="width:${p}%"></i></div><div class="row"><span class="stat"><b>${String(Math.floor(p*.9/60)).padStart(2,"0")}:${String(Math.floor(p*.9)%60).padStart(2,"0")}</b>Elapsed</span><span class="stat"><b>~${eta}s</b>Left</span><span class="stat"><b>2.4x</b>Speed</span></div></div>
<div class="card">${st.map((s,i)=>{const d=p>=th[i],c=!d&&p>=(th[i-1]||0);return`<div class="row" style="padding:7px 0">${d?"✅":c?"🔄":"⏳"}<div style="flex:1"><b>${s}</b><small style="color:var(--mu)">${d?"Completed (100%)":c?"In Progress":"Waiting in queue"}</small></div></div>`}).join("")}</div>
<div class="card">${CL.filter((c,i)=>S.st[i]==1).map((c,i,a)=>{const q=Math.max(0,Math.min(100,Math.round((p-i*12)*1.2)));return`<div class="row" style="padding:5px 0"><b style="flex:1">Clip ${i+1}</b><small style="color:var(--mu)">${q>=100?"Done ✓":q>0?"Rendering "+q+"%":"Queued (0%)"}</small></div>`}).join("")}</div>
<button class="out" data-a="cancel">Cancel Rendering</button><p style="text-align:center;color:var(--mu)">Running 100% on-device</p>`}
function lib(d){const n=S.st.filter(x=>x==1).length||5;
return d?`<div class="bar"><button class="back" data-a="go" data-v="lib">←</button><div><div class="ttl">🔴 Ranked Shorts Live Stream</div><small style="color:var(--mu)">${n} clip(s) from this video</small></div></div>
${Array.from({length:n},(_, i)=>`<div class="card"><div class="row">${S.out&&S.out[i]?`<video controls playsinline src="${S.out[i].url}" style="width:96px;border-radius:10px;background:#000"></video>`:`<div class="frame" style="width:60px;margin:0"><div>▶</div></div>`}<div style="flex:1"><b>Clip ${i+1}</b> <span class="pill">9:16 Shorts</span><small style="color:var(--mu)">Duration: ${S.len} • ${CL[i%4][1].split(" – ")[0]}</small></div></div><div class="row" style="margin-top:10px"><button class="btn" data-a="go" data-v="edit">✎ Edit</button><button class="btn" data-a="sv" data-i="${i}">⬇ Save</button><button class="btn" data-a="toast" data-v="Share sheet opened">↗</button><button class="btn r" data-a="toast" data-v="Clip deleted">🗑</button></div>
<div class="row" style="margin-top:8px"><span class="nw" style="margin:0">NEW</span><button class="btn" data-a="toast" data-v="Posting to Reels, Shorts and TikTok">Post to Reels / Shorts</button></div></div>`).join("")}`
:`<div class="bar"><button class="back" data-a="go" data-v="home">←</button><div><div class="ttl">My Viral Videos</div><small style="color:var(--mu)">1 video(s) • ${n} total clip(s)</small></div></div><div class="card" data-a="go" data-v="det" style="cursor:pointer"><div class="row"><div class="frame" style="width:70px;margin:0;aspect-ratio:16/9"><div>▶</div></div><div style="flex:1"><b>🔴 Ranked Shorts Live Stream</b><small style="color:var(--mu)">Streamer • Today</small><span class="pill" style="background:var(--pt);color:var(--pu)">${n} Clip(s) Available</span></div>›</div></div>`}
function mod(){return`<div class="bar"><button class="back" data-a="go" data-v="home">←</button><div class="ttl">AI Models &amp; Tools</div></div><div class="seg">${["Viral LLM (AI)","Speech Captions"].map((x,i)=>`<button class="${S.mt==i?"on":""}" data-a="s" data-k="mt" data-v="${i}">${x}</button>`).join("")}</div>
${MOD[S.mt].map((m,i)=>`<div class="card" style="border-color:${S.mod[S.mt][i]?"var(--gn)":i==1&&!S.mt?"var(--pu)":"var(--bd)"}"><div class="row"><div style="flex:1"><b>${m[0]}</b><small style="color:var(--mu)">${m[1]}</small></div>${S.mod[S.mt][i]?'<span class="pill">Active in App</span>':`<button class="btn" data-a="dl" data-i="${i}">Download (${m[1]})</button>`}</div></div>`).join("")}
<div class="card" style="background:var(--gt)">🛡 <b>100% On-Device Processing.</b> No audio, video, or data is ever sent to external cloud servers.</div><button class="out" style="color:var(--tx);border-color:var(--bd)" data-a="go" data-v="home">Done / Return to Home</button>`}
function ap(){const o=$("#otx");if(!o)return;o.textContent=S.etxt||"Type your subtitle";o.style.top=S.ey+"%";o.style.fontSize=S.esz+"px";o.style.color=S.ecol;$("#pv").style.filter="brightness("+(1+S.br/100)+") contrast("+(1+S.ct/100)+")";$("#pi").style.transform="scale("+S.zm/100+")"}

return`<div class="bar"><button class="ib" data-a="go" data-v="det" aria-label="Close">✕</button><div class="sp"></div><span class="ch on">1080p</span><button class="btn gn" data-a="save">✓ Save</button></div>
<div id="pv" class="frame" style="max-width:250px;margin:0 auto 12px"><div id="pi" style="position:absolute;inset:0;display:flex;flex-direction:column"><div style="background:radial-gradient(circle at 35% 60%,#8a846f,#15130f)">Gameplay</div><i class="seam"></i><div style="background:linear-gradient(135deg,#8a1f5a,#1d2a66)">Streamer</div></div><b id="otx" style="position:absolute;top:50%;padding:0 8px;font-weight:900">${S.etxt}</b></div>
<button class="cta" style="position:static;margin:0 0 12px" data-a="auto">✨ Auto Adjust video <span class="nw">NEW</span></button>
<div class="card" style="padding:8px"><div class="row"><span class="stat">00:00</span><div style="flex:3;height:36px;border-radius:8px;background:linear-gradient(90deg,#3a362c,#7a2a55,#3a362c,#7a2a55)"></div></div><div style="margin:6px 0 0 58px;background:var(--am);color:#111;border-radius:8px;padding:6px 10px;font-weight:700">${S.etxt}</div></div>
<div class="chips" style="margin-bottom:8px">${["Crop","Style","Adjust","Text"].map(x=>`<button class="ch ${t==x?"on":""}" data-a="et" data-v="${x}">${x}</button>`).join("")}</div>
<div class="card">${t=="Text"?`<b>Subtitle text</b><input type="text" style="margin-top:8px" placeholder="Type your subtitle" value="${S.etxt}" data-a="in" data-k="etxt">${rg("ey","Position",8,92)}${rg("esz","Size",14,38)}<button class="btn" data-a="gen">Auto-write from speech</button>`:t=="Style"?`<b>Subtitle colour</b><div class="chips" style="margin-top:8px">${[["White","#FFFFFF"],["Viral Yellow","#FACC15"],["Neon Cyan","#22D3EE"],["Lime","#A3E635"],["Amber","#FB923C"]].map(c=>`<button class="ch ${S.ecol==c[1]?"on":""}" data-a="ec" data-v="${c[1]}">${c[0]}</button>`).join("")}</div>`:t=="Adjust"?rg("br","Brightness",-30,30)+rg("ct","Contrast",-30,30):`<b>Framing</b><small style="display:block;color:var(--mu)">Zoom in on the streamer or game. Auto Adjust does this for you.</small>${rg("zm","Zoom",100,160)}`}</div>`}
function R(){$("#app").innerHTML=({home,rev,prog,lib:()=>lib(0),det:()=>lib(1),mod,edit})[S.scr]()+(S.scr=="lib"||S.scr=="det"?'<button class="fab" data-a="go" data-v="home">+ New Clip</button>':"")+(S.help?`<div class="modal" data-a="help"><div class="card"><h3 style="margin-top:0">Layout help</h3><p><b>Auto (recommended):</b> finds gameplay and facecam and splits them 50/50.</p><p><b>Set it myself:</b> drag boxes over the game and the streamer.</p><p><b>Full frame:</b> crops around the person, ideal for Just Chatting.</p><p><b>When Auto gets it wrong:</b> switch to manual boxes. They apply to every moment of that link.</p><button class="cta" data-a="help">Got it</button></div></div>`:"")}
function upd(){const c=$("#cta");if(c){c.className="cta "+(S.url.length>6||S.file?"":"off")}}
document.addEventListener("input",e=>{const d=e.target.dataset;if(d.a=="in"){S[d.k]=e.target.value;upd();ap()}if(d.a=="rg"){S[d.k]=+e.target.value;ap()}});
document.addEventListener("click",async e=>{const el=e.target.closest("[data-a]");if(!el||el.tagName=="INPUT"||el.tagName=="TEXTAREA")return;const d=el.dataset,a=d.a,v=d.v;
if(a=="t")S[d.k]=S[d.k]?0:1;else if(a=="s"){S[d.k]=isNaN(v)||d.k=="len"?v:+v;if(d.k=="len")S.len=v}else if(a=="go"){S.scr=v;scrollTo(0,0)}
else if(a=="th")S.th=Math.max(1,Math.min(20,S.th+ +v));else if(a=="help")S.help=S.help?0:1;else if(a=="swap"){S.swap^=1}
else if(a=="paste"){try{S.url=window.AndroidBridge?AndroidBridge.paste():await navigator.clipboard.readText();toast("ClipMe pasted from your clipboard")}catch(x){toast("Long-press the box and tap Paste")}}
else if(a=="scan"){if(window.AndroidBridge&&S.url.length>6&&!(S.file&&S.src==S.url))await getLink();if(!S.file)return toast("Paste a video link first");toast("Analysing audio on your device...");await analyse();if(window.AndroidBridge&&S.cap&&CL.length){toast("Getting caption model...");if(!await model())toast("Captions need internet once to get the speech model")}if(!CL.length)return toast("No clips found. Try a longer video.");if(S.rev){S.scr="rev"}else{S.st=CL.map(()=>1);a2()}}
else if(a=="st"){S.st[+d.i]=+v}else if(a=="render"){if(!S.st.includes(1))return toast("Approve at least one clip");a2()}
else if(a=="cancel"){S.cancel=1;S.scr="home"}else if(a=="dl"){S.mod[S.mt][+d.i]=1;toast("Downloaded "+MOD[S.mt][+d.i][0])}
else if(a=="sv"){await savec(+d.i);return}else if(a=="train"){try{localStorage.setItem("dc_prm",S.prm)}catch(x){}const r=rules();toast("Trained: skip first "+r.skip+"s, prefer "+(r.calm?"calm":"loud")+" moments")}else if(a=="auto"){S.zm=118;S.br=8;S.ct=12;toast("Auto Adjust: face centred, light balanced, shake steadied")}else if(a=="gen"){S.etxt="He did not expect this";toast("Subtitles generated from speech")}else if(a=="ec"){S.ecol=v}else if(a=="et"){S.etab=v}else if(a=="save"){S.scr="det";toast("Clip saved with subtitles")}else if(a=="toast")return toast(v);else if(a=="pro")return toast("ClipMe Pro: no ads, 4K export, priority rendering");
R();ap()});
async function a2(){S.pct=0;S.scr="prog";S.out=[];S.cancel=0;const ids=CL.map((c,i)=>i).filter(i=>S.st[i]==1);R();for(let k=0;k<ids.length;k++){if(S.cancel)return;const o=await rec(CL[ids[k]],p=>{if(S.scr=="prog"){S.pct=Math.min(99,Math.round((k+p)/ids.length*100));R()}});if(S.cancel)return;S.out.push(o)}S.pct=100;S.scr="det";toast("Clips ready. Play one, then use the video menu to download.");R()}
async function savec(i){const o=S.out&&S.out[i];if(!o)return toast("Render the clip first");if(!window.AndroidBridge)return toast("Play the clip, then use its menu to download");const bl=await(await fetch(o.url)).blob(),fr=new FileReader();fr.onload=()=>AndroidBridge.save(fr.result.split(",")[1],"clipme-"+(i+1)+".webm");fr.readAsDataURL(bl)}
async function faceAt(v){if(!window.AndroidBridge)return null;try{const c=document.createElement("canvas");c.width=320;c.height=Math.round(320*v.videoHeight/v.videoWidth);c.getContext("2d").drawImage(v,0,0,c.width,c.height);return JSON.parse(AndroidBridge.face(c.toDataURL("image/jpeg",.7).split(",")[1]))}catch(e){return null}}
async function capsFor(c){if(!window.AndroidBridge||!S.abuf||!S.cap)return[];try{const oc=new OfflineAudioContext(1,Math.ceil(c[6]*16000),16000),s=oc.createBufferSource();s.buffer=S.abuf;s.connect(oc.destination);s.start(0,c[5],c[6]);const f=(await oc.startRendering()).getChannelData(0),u=new Int16Array(f.length);for(let i=0;i<f.length;i++)u[i]=Math.max(-1,Math.min(1,f[i]))*32767;AndroidBridge.capStart();const by=new Uint8Array(u.buffer);for(let o=0;o<by.length;o+=96000){let t="";const sl=by.subarray(o,o+96000);for(let k=0;k<sl.length;k+=8192)t+=String.fromCharCode.apply(null,sl.subarray(k,k+8192));AndroidBridge.capChunk(btoa(t))}return JSON.parse(AndroidBridge.capEnd())}catch(e){return[]}}
function model(){return new Promise(r=>{window.onModel=r;AndroidBridge.prep(S.lang=="English"?"en":"hi")})}
function getLink(){return new Promise(res=>{window.onDlp=t=>toast(t);window.onDl=p=>{if(!p){toast("Couldn’t download this link. Check it is public.");return res()}S.file=true;S.vurl="/media/"+p+"?t="+Date.now();S.aurl="/media/video.wav?t="+Date.now();S.src=S.url;res()};toast("Downloading video...");AndroidBridge.fetch(S.url,S.tab=="l"?1:0)})}
function rules(){const p=(S.prm||"").toLowerCase(),m=p.match(/skip (?:the )?first (\d+)/);return{skip:m?+m[1]:0,calm:/calm|quiet|story|talk/.test(p)&&!/loud/.test(p)}}
function brain(){return`<div class="card">${head("🧠","Train your offline AI","Tell it what a good clip is",'<span class="nw">NEW</span>')}<div class="body"><textarea data-a="in" data-k="prm" rows="3" style="width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px;font:inherit">${S.prm}</textarea><div class="row" style="margin-top:8px"><button class="btn" data-a="train">Save &amp; train</button><small style="color:var(--mu)">Understands: skip first 30, calm, quiet, loud</small></div></div></div>`}
async function analyse(){const ac=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});let bf;try{bf=await ac.decodeAudioData(await(await fetch(S.aurl)).arrayBuffer())}catch(x){CL.length=0;return toast("Couldn’t read audio from this file")}
S.abuf=bf;const r=rules(),d=parseInt(S.len)||20,ch=bf.getChannelData(0),sr=bf.sampleRate,N=Math.floor(bf.duration),e=[];
for(let s=0;s<N;s++){let a=0;for(let i=0;i<sr;i+=50)a+=Math.abs(ch[s*sr+i]||0);e.push(a/(sr/50))}
const mx=Math.max(...e,1e-6),sc=e.map(x=>x/mx),w=Math.min(d,N),sk=Math.min(r.skip,Math.max(0,N-w)),W=[];
for(let s=sk;s+w<=N;s++){let m=0;for(let i=s;i<s+w;i++)m+=sc[i];m/=w;W.push([s,r.calm?1-m:m])}
W.sort((a,b)=>b[1]-a[1]);const pk=[];for(const x of W){if(pk.length>=S.n)break;if(pk.every(p=>Math.abs(p[0]-x[0])>=w))pk.push(x)}
pk.sort((a,b)=>a[0]-b[0]);CL.length=0;const t=s=>new Date(s*1e3).toISOString().substr(11,8);
pk.forEach((p,i)=>CL.push([S.ht||("Moment "+(i+1)),t(p[0])+" – "+t(p[0]+w),r.calm?"😌 Calm moment":"🔥 Audio peak",Math.round(55+p[1]*44),r.calm?"Quiet, steady audio":"Loudest stretch of the video",p[0],w]));S.st=CL.map(()=>0)}
function rec(c,cb){return new Promise(res=>{const v=document.createElement("video");v.src=S.vurl;v.playsInline=true;const cv=document.createElement("canvas");cv.width=540;cv.height=960;const x=cv.getContext("2d");let go=0;
v.onloadedmetadata=()=>{v.currentTime=c[5]+.01};
v.onseeked=async()=>{if(go)return;go=1;const F=await faceAt(v),K=await capsFor(c);const cs=cv.captureStream(30);try{v.captureStream().getAudioTracks().forEach(t=>cs.addTrack(t))}catch(e){}
const mr=new MediaRecorder(cs),parts=[];mr.ondataavailable=e=>parts.push(e.data);mr.onstop=()=>res({url:URL.createObjectURL(new Blob(parts,{type:"video/webm"}))});
const W=v.videoWidth,H=v.videoHeight,z=S.zm/100,cover=(sx,sy,sw,sh,dy,dh)=>{const k=Math.min(sw/540,sh/dh),cw=540*k,chh=dh*k;x.drawImage(v,sx+(sw-cw)/2,sy+(sh-chh)/2,cw,chh,0,dy,540,dh)};
const fcrop=()=>{if(!F)return cover(W*.5-W/(2*1.6*z),H*.5-H/(2*1.6*z),W/(1.6*z),H/(1.6*z),480,480);let cw=Math.min(W,Math.max(F[2]*W*3.2,W*.2)),hh=cw/1.125;if(hh>H){hh=H;cw=hh*1.125}x.drawImage(v,Math.max(0,Math.min(W-cw,F[0]*W-cw/2)),Math.max(0,Math.min(H-hh,F[1]*H-hh*.45)),cw,hh,0,480,540,480)};const draw=()=>{if(S.cancel){mr.stop();v.pause();return}x.fillStyle="#000";x.fillRect(0,0,540,960);
if(S.fmt=="v"&&S.lay!="Full frame"){cover(0,0,W,H,0,480);fcrop();x.fillStyle="#fff";x.fillRect(0,478,540,4)}else cover(0,0,W,H,0,960);
x.textAlign="center";x.lineWidth=7;x.strokeStyle="#000";x.font="900 36px sans-serif";x.fillStyle=S.ecol;const ty=S.ey/100*960;const tt=v.currentTime-c[5],ix=K.findIndex(q=>tt>=q[1]&&tt<=q[2]+.15),gi=Math.floor(ix/3)*3,g=window.AndroidBridge?(ix<0?"":K.slice(gi,gi+3).map(q=>q[0]).join(" ").toUpperCase()):S.etxt;x.strokeText(g,270,ty);x.fillText(g,270,ty);
if(S.hook&&S.ht){x.font="900 30px sans-serif";x.fillStyle="#FACC15";x.strokeText(S.ht,270,70);x.fillText(S.ht,270,70)}
cb(Math.max(0,(v.currentTime-c[5])/c[6]));if(v.currentTime>=c[5]+c[6]||v.ended){mr.stop();v.pause();return}requestAnimationFrame(draw)};
mr.start();v.play().catch(()=>{v.muted=true;v.play()});draw()}})}
document.addEventListener("change",e=>{if(e.target.id=="vf"){const f=e.target.files[0];if(f){S.file=f;S.src=S.url;S.vurl=URL.createObjectURL(f);toast("Loaded "+f.name);R();ap()}}});
try{S.prm=localStorage.getItem("dc_prm")||""}catch(e){}if(!S.prm)S.prm="Find the loudest, most exciting moments. Skip the first 30 seconds.";
R();toast("🧠 AI Brain active: Phi-3 Mini (Fast)");
</script></body></html>
