<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ClipMe</title>
<style>
:root{--bg:#F6F7FB;--card:#fff;--bd:#E8EAF2;--tx:#111827;--mu:#6B7280;--pu:#5B46F6;--pt:#F2F0FF;--rd:#EF4444;--rt:#FEF2F2;--gn:#10B981;--gt:#ECFDF5;--am:#F59E0B;--at:#FFFBEB;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1020;--card:#191A2E;--bd:#2A2C48;--tx:#F3F4F8;--mu:#9CA3AF;--pt:#26225A;--rt:#3A1A20;--gt:#0F2E25;--at:#3A2D0E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1020;--card:#191A2E;--bd:#2A2C48;--tx:#F3F4F8;--mu:#9CA3AF;--pt:#26225A;--rt:#3A1A20;--gt:#0F2E25;--at:#3A2D0E;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 "Plus Jakarta Sans",Inter,system-ui,sans-serif;max-width:520px;margin:0 auto;padding:0 14px 90px}
.bar{display:flex;align-items:center;gap:10px;padding:14px 0}.logo{width:38px;height:38px;border-radius:11px;background:var(--rd);color:#fff;display:grid;place-items:center;font-size:18px}
.ttl{font-weight:800;font-size:18px;line-height:1}.by{font-size:9px;font-weight:700;color:var(--rd);background:var(--rt);padding:1px 6px;border-radius:6px;display:inline-block;margin-top:3px}
.sp{flex:1}.ib{position:relative;border:1px solid var(--bd);background:var(--card);border-radius:12px;width:38px;height:38px;font-size:17px;cursor:pointer;color:var(--tx)}
.bd{position:absolute;top:-5px;right:-5px;background:var(--pu);color:#fff;font-size:10px;border-radius:9px;padding:0 5px}
.pro{border:1.5px solid var(--am);color:var(--am);background:none;border-radius:20px;padding:8px 12px;font-weight:700;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bd);padding:4px;border-radius:14px;margin-bottom:10px}
.seg button{border:1.5px solid transparent;background:none;border-radius:11px;padding:10px;font-weight:700;color:var(--mu);cursor:pointer;font:inherit;font-weight:700}
.seg .on{background:var(--card);border-color:var(--pu);color:var(--pu)}.seg .on.l{border-color:var(--rd);color:var(--rd)}
.sub{color:var(--mu);margin:0 0 12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(17,24,39,.05)}
.card.live{border-color:#FECACA}.row{display:flex;align-items:center;gap:10px}.row h3{margin:0;font-size:15px}.row small{color:var(--mu);display:block;font-size:12.5px}
.ic{width:34px;height:34px;border-radius:10px;background:var(--pt);display:grid;place-items:center}
.tg{width:46px;height:26px;border-radius:13px;border:0;background:var(--bd);position:relative;cursor:pointer;flex:none;transition:background .2s}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:var(--pu)}.tg.on:after{left:23px}.tg.g.on{background:var(--gn)}.tg.a.on{background:var(--am)}
.body{margin-top:12px}input[type=text]{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px;font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}
.ch{flex:none;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}
.ch.on{border-color:var(--pu);background:var(--pt);color:var(--pu)}.ch.l.on{border-color:var(--rd);background:var(--rt);color:var(--rd)}
.grid{display:grid;gap:6px}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5 .ch,.g4 .ch{padding:9px 2px;font-size:12px;text-align:center}
.cap{flex:none;width:130px;height:76px;border-radius:12px;background:#1b1b24;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;border:2px solid transparent;cursor:pointer}.cap.on{border-color:var(--pu)}
.pill{display:inline-block;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:700;background:var(--gt);color:var(--gn)}
.note{background:var(--pt);color:var(--pu);border-radius:12px;padding:10px;font-weight:600;font-size:13px}
.cta{position:sticky;bottom:10px;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;color:#fff;background:var(--pu);cursor:pointer;margin:6px 0 12px}.cta.off{background:#9CA3AF}.cta.l{background:var(--rd)}.cta.g{background:var(--gn)}
.out{width:100%;border:1.5px solid var(--rd);color:var(--rd);background:none;border-radius:14px;padding:13px;font:inherit;font-weight:700;margin-bottom:12px;cursor:pointer}
.frame{aspect-ratio:9/16;max-width:150px;margin:8px auto;border-radius:12px;background:#222;position:relative;overflow:hidden;display:flex;flex-direction:column}
.frame div{flex:1;display:grid;place-items:center;color:#fff;font-size:11px}.frame .seam{flex:none;height:3px;background:#fff}
.frame b{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#FACC15;font-size:12px;text-shadow:0 1px 3px #000}
.sc{font-weight:800;border-radius:10px;padding:4px 9px;background:var(--at);color:var(--am);font-size:12px}
.btn{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:11px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}
.btn.r{border-color:var(--rd);color:var(--rd)}.btn.gn{background:var(--gn);border-color:var(--gn);color:#fff}
.prog{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--pu);transition:width .3s}
.stat{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--mu)}.stat b{display:block;color:var(--tx);font-size:14px}
.tab{display:flex;gap:6px;align-items:center}.back{border:0;background:none;font-size:22px;color:var(--tx);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#111827;color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;z-index:9;max-width:90%;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:8;padding:20px}.modal .card{max-width:380px}
.fab{position:fixed;right:max(14px,calc(50% - 246px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--pu);color:#fff;border:0;border-radius:26px;padding:14px 18px;font:inherit;font-weight:800;cursor:pointer}
.nw{font-size:10px;font-weight:800;background:var(--am);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
.warn{background:var(--at);color:var(--am);border-radius:12px;padding:10px;font-weight:600;font-size:13px;margin-bottom:12px}
.err{color:var(--rd);font-size:12.5px;display:block;margin-top:6px}
.cta.busy{background:#9CA3AF;pointer-events:none}
.rowb{display:flex;gap:8px;align-items:center}
.btn.sm{padding:7px 10px;font-size:13px}
</style></head><body><div id="app"></div><div id="t"></div>
<script>
"use strict";
const B=window.AndroidBridge||null;
const $=q=>document.querySelector(q);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PAL=[["Viral Yellow","VIRAL MOMENT","#FACC15"],["Neon Cyan","NEXT LEVEL","#22D3EE"],["High Energy Lime","INSANE REACTION","#A3E635"],["Sunset Amber","MUST WATCH","#FB923C"]];
const FB=["WAIT FOR IT!","INSANE MOMENT!","YOU WON'T BELIEVE THIS!","THE BEST PART!","WATCH CLOSELY!"];
const MT=["llm","asr"];
let CL=[];
const S={tab:"n",scr:"home",url:"",ai:1,cap:1,cs:0,hook:0,ht:"",n:3,len:"20s",fmt:"v",lay:"Auto",corner:"tr",rev:1,auto:1,dur:"Auto",fa:1,lang:"English",music:0,viral:1,mt:0,pct:0,help:0,swap:0,ey:50,esz:22,ecol:"#FACC15",etab:"Text",br:0,ct:0,zm:100,st:[],out:[],cp:[],M:null,dlp:{},err:{},note:{},busy:"",ei:0,eh:"",prm:"",info:null,title:"",t0:0,dcf:-1,file:null,src:"",vurl:"",aurl:"",abuf:null};
let tm;
const mb=n=>n>=1e9?(n/1e9).toFixed(1)+" GB":Math.round(n/1e6)+" MB";
const fmt=s=>new Date(Math.max(0,s)*1e3).toISOString().substr(11,8);
const key=()=>S.url+"|"+S.tab;
function toast(m){clearTimeout(tm);$("#t").innerHTML='<div class="toast">'+esc(m)+'</div>';tm=setTimeout(()=>$("#t").innerHTML="",2800)}
const tg=(k,c="")=>`<button class="tg ${c} ${S[k]?"on":""}" data-a="t" data-k="${k}" aria-label="toggle"></button>`;
const ch=(k,l,v,c="")=>`<button class="ch ${c} ${S[k]===v?"on":""}" data-a="s" data-k="${k}" data-v="${v}">${l}</button>`;
const head=(i,t,s,x="")=>`<div class="row"><div class="ic">${i}</div><div style="flex:1"><h3>${t}</h3><small>${s}</small></div>${x}</div>`;
const lenCta=()=>S.tab=="n"?`Scan &amp; Preview ${S.n} Clip${S.n>1?"s":""} (${S.len})`:"Record 5 min &amp; find clips";

/* ---------- models (real state comes from the Android side) ---------- */
function loadM(){if(!B)return;try{S.M=JSON.parse(B.models())}catch(e){S.M=null}}
function act(k){const M=S.M;if(!M)return null;return M[k].find(m=>m.id==M.active[k])||null}
const llmReady=()=>!!(B&&S.M&&S.M.engine&&act("llm"));
const nInst=()=>S.M?S.M.llm.concat(S.M.asr).filter(m=>m.installed).length:0;
window.onMdlNote=(id,m)=>{S.note[id]=m;if(S.scr=="mod")R()};
window.onMdl=(id,d,t)=>{S.dlp[id]={d,t};if(d>0)delete S.note[id];if(S.scr=="mod")R()};
window.onMdlEnd=(id,ok,msg)=>{delete S.dlp[id];delete S.note[id];if(ok||msg=="Cancelled")delete S.err[id];else S.err[id]=msg;loadM();toast(ok?"Model ready ✓":msg=="Cancelled"?"Download cancelled":"Download failed: "+msg);if(S.scr=="mod"||S.scr=="home")R()};

/* ---------- screens ---------- */
function layout(){const man=S.lay=="Set it myself";return`<div class="card">${head("▦","Layout","Choose how 9:16 clips are framed",'<button class="btn" data-a="help">? Help</button>')}<div class="body"><div class="chips">${["Auto","Set it myself","Full frame"].map(x=>ch("lay",x+(x=="Auto"?" (Recommended)":""),x)).join("")}</div>
${S.lay=="Auto"?`<div class="frame"><div>Gameplay</div><i class="seam"></i><div>Facecam</div><b>VIRAL MOMENT</b></div><small style="color:var(--mu)">Video on top, the detected face on the bottom, captions on the centre seam.</small>`:S.lay=="Full frame"?`<div class="frame"><div style="background:#444">Person, cropped vertically</div></div>`:`<p style="margin:10px 0 6px;font-weight:700">Where is the facecam in your video?</p><div class="grid g4">${[["tl","↖ Top-left"],["tr","↗ Top-right"],["bl","↙ Bottom-left"],["br","↘ Bottom-right"]].map(c=>ch("corner",c[1],c[0])).join("")}</div><div class="row" style="margin-top:10px"><button class="btn" data-a="swap">⇅ Swap</button> <small style="color:var(--mu)">${S.swap?"Facecam on top":"Facecam on bottom"}. Applies to every clip from this link.</small></div>`}</div></div>`}
function captions(){const sm=act("asr");return`<div class="card">${head("CC","Dynamic Auto-Captions","Word-by-word on-device subtitles",tg("cap"))}${S.cap?`<div class="body"><div class="chips">${PAL.map((c,i)=>`<div class="cap ${S.cs==i?"on":""}" style="color:${c[2]}" data-a="cs" data-v="${i}">${c[1]}</div>`).join("")}</div>
<p style="margin:10px 0 6px;font-weight:700">Caption language<span class="nw">NEW</span></p><div class="chips">${["English","Hindi","Hinglish"].map(x=>ch("lang",x,x)).join("")}</div><div style="margin-top:10px">${!B?'<span class="pill" style="background:var(--at);color:var(--am)">Captions work in the Android app</span>':sm?`<span class="pill">Speech model: ${esc(sm.name)}</span>`:`<button class="btn sm" data-a="go" data-v="mod" data-mt="1">⬇ Get speech model (~40 MB)</button>`}</div></div>`:""}</div>`}
function hook(){const ai=llmReady();return`<div class="card">${head("T","Hook Title Header","Viral text on top area",tg("hook"))}${S.hook?`<div class="body"><div class="note">${ai?"AI Auto-Hook Active: the LLM writes a hook for each clip":"Auto-hook uses preset hooks. Download an AI model to get a custom hook per clip."}</div><div class="chips" style="margin:10px 0">${["WAIT FOR IT! 😱🔥","HE DID NOT EXPECT THIS! 😂💀","INSTANT KARMA! 🤯","UNREAL 1000 IQ PLAY! 🔥","MUST WATCH TILL END! 🔥🎬"].map(x=>ch("ht",x,x)).join("")}</div><input type="text" placeholder="Or type your own hook (same for every clip)" value="${esc(S.ht)}" data-a="in" data-k="ht"><small style="color:var(--mu)">Leave empty to let the AI write one per clip.</small></div>`:""}</div>`}
function extras(){return`<div class="card">${head("★","New: Creator Extras","Added on top of the original",'<span class="nw">NEW</span>')}<div class="body"><div class="row" style="margin-bottom:10px"><div style="flex:1"><b>Viral Score (0–100)</b><small style="color:var(--mu)">Rank every clip and explain why</small></div>${tg("viral")}</div><div class="row"><div style="flex:1"><b>Auto Background Music</b><small style="color:var(--mu)">Generated beat, no copyright issues</small></div>${tg("music","g")}</div></div></div>`}
function brain(){return`<div class="card">${head("🧠","Train your offline AI","Tell it what a good clip is",'<span class="nw">NEW</span>')}<div class="body"><textarea data-a="in" data-k="prm" rows="3" style="width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px;font:inherit">${esc(S.prm)}</textarea><div class="row" style="margin-top:8px"><button class="btn" data-a="train">Save &amp; train</button><small style="color:var(--mu)">Try: skip first 30, calm, quiet, loud. The AI model also reads your words.</small></div></div></div>`}
function home(){const L=S.tab=="l",v=S.url.length>6||S.file,am=act("llm"),cl=S.busy?"busy":v?"":"off";
return`<div class="bar"><div class="logo">▶</div><div><div class="ttl">ClipMe</div></div><div class="sp"></div><button class="ib" data-a="go" data-v="lib" aria-label="My clips">🎞</button><button class="ib" data-a="go" data-v="mod" aria-label="AI models">🧠${nInst()?`<span class="bd">${nInst()}</span>`:""}</button></div>
<div class="seg"><button class="${!L?"on":""}" data-a="s" data-k="tab" data-v="n">🎬 Normal Video</button><button class="${L?"on l":""}" data-a="s" data-k="tab" data-v="l">📡 Live Stream</button></div>
<p class="sub">${L?"Records 5 minutes of a live stream, then finds the best moments (loudness, facecam reactions and AI).":"Turn long online video streams into viral clips automatically."}</p>
<div class="card ${L?"live":""}">${head(L?"🔴":"🔗",L?"Live Stream Link":"Video Stream URL","")}<div class="body row"><input type="text" id="url" placeholder="${L?"Paste live stream link here...":"Paste video or stream link here..."}" value="${esc(S.url)}" data-a="in" data-k="url"><button class="ib" data-a="paste" aria-label="Paste">📋</button></div>${L?"":`<div style="margin-top:10px"><label class="btn" style="display:block;text-align:center"><input type="file" id="vf" accept="video/*" style="display:none">📁 Or choose a video from your phone${S.file&&S.file.name?" ✓ "+esc(S.file.name.slice(0,24)):""}</label></div>`}</div>
${L?`<div class="card">${head("✨","Auto-Clip on Hype Spikes","Finds the loudest moments in the recording &amp; queues them for preview",tg("auto","a"))}${S.auto?`<div class="body"><div class="chips">${["10s (Short)","20s (Reel)","30s (Viral)","60s (Full)","Auto"].map(x=>ch("dur",x,x)).join("")}</div><div class="chips" style="margin-top:12px">${`<button class="ch ${S.fa?"on":""}" data-a="t" data-k="fa">😱 Face Check (prefer moments with a face)</button>`}</div></div>`:""}</div>
<div class="card">${head("✔","Review Before Rendering","Pass or Reject clips first",tg("rev","g"))}</div>`:
`<div class="card">${head("🧠","AI Viral Analysis",S.ai?(!B?"AI runs in the Android app":S.M&&!S.M.engine?"LLM engine missing in this build":am?"Use on-device LLM model":"No AI model downloaded yet"):"Using fast community highlight",tg("ai"))}${S.ai&&B?`<div class="body">${am?`<div class="row ch on" style="width:100%" data-a="go" data-v="mod">● <div style="flex:1"><b>${esc(am.name)}</b><small style="color:var(--mu)">${mb(am.size)} • On-Device GGUF</small></div>✓</div>`:`<button class="btn" style="width:100%" data-a="go" data-v="mod">⬇ Download an AI model</button>`}</div>`:""}</div>`}
${brain()}${captions()}${hook()}
${L?"":`<div class="card"><b>Number of Viral Clips</b><div class="grid g5" style="margin-top:8px">${[1,2,3,4,5].map(x=>ch("n",x+(x>1?" Clips":" Clip"),x)).join("")}</div></div>
<div class="card"><b>Clip Length</b><div class="grid g4" style="margin-top:8px">${["20s / Fast","30s / Viral","40s / Story","60s / Full"].map(x=>ch("len",x,x.split(" ")[0])).join("")}</div></div>`}
<div class="card"><b>Output Format</b><div class="chips" style="margin-top:8px">${ch("fmt","Vertical Shorts / Reels (9:16)","v")}${ch("fmt","Landscape (16:9)","h")}</div></div>
${S.fmt=="v"?layout():""}${extras()}
${L?"":`<div class="card">${head("✔","Review Before Rendering","Preview clips to Pass or Reject before final export (saves rendering time)",tg("rev","g"))}</div>`}
<button class="cta ${L?"l ":""}${cl}" id="cta" data-a="scan">${esc(S.busy)||lenCta()}</button>
`}
function rev(){const a=S.st.filter(x=>x==1).length,r=S.st.filter(x=>x==2).length;
return`<div class="bar"><button class="back" data-a="go" data-v="home">←</button><div><div class="ttl">Review Detected Clips</div><small style="color:var(--mu)">Approve clips to render • Reject to skip</small></div></div>
<div class="row" style="margin-bottom:12px"><span class="stat"><b>${S.st.length-a-r}</b>Pending</span><span class="stat"><b style="color:var(--gn)">${a}</b>Approved</span><span class="stat"><b style="color:var(--rd)">${r}</b>Rejected</span></div>
${CL.map((c,i)=>`<div class="card" style="${S.st[i]==1?"border-color:var(--gn)":S.st[i]==2?"opacity:.55":""}"><div class="row" style="align-items:flex-start"><div class="frame" style="width:70px;margin:0;flex:none"><div>▶</div><i class="seam"></i><div></div><b style="font-size:8px">${esc((c.text||"").split(" ")[0]||"")}</b></div><div style="flex:1"><b>${esc(c.hook)}</b><div style="margin:6px 0"><span class="pill">${c.tag}</span></div><small style="color:var(--mu)">${fmt(c.s)} – ${fmt(c.s+c.l)}</small>${c.text?`<small style="color:var(--mu);display:block;margin-top:4px">“${esc(c.text.slice(0,110))}${c.text.length>110?"…":""}”</small>`:""}</div></div>
${S.viral?`<div class="row" style="margin-top:8px"><span class="sc">Viral score ${c.score}</span><small style="color:var(--mu)">${esc(c.why)}</small></div>`:""}
<div class="row" style="margin-top:10px"><button class="btn r" style="flex:1" data-a="st" data-i="${i}" data-v="2">✕ Reject</button><button class="btn gn" style="flex:1" data-a="st" data-i="${i}" data-v="1">✓ Approve</button></div></div>`).join("")}
<button class="cta ${a?"g":"off"}" data-a="render">Render Approved Clips (${a})</button>`}
function prog(){const p=S.pct,el=Math.round((Date.now()-S.t0)/1e3),eta=p>3?Math.round(el*(100-p)/p):0,ids=S.ids||[];
return`<div class="bar"><div class="ttl">Processing Clips...</div><div class="sp"></div><button class="btn" data-a="go" data-v="home">Minimize</button></div>
<div class="card"><div class="row"><b style="color:var(--pu);font-size:22px">${p}% Done</b><div class="sp"></div><span style="color:var(--mu)">${100-p}% Left</span></div><div class="prog"><i style="width:${p}%"></i></div><div class="row"><span class="stat"><b>${String(Math.floor(el/60)).padStart(2,"0")}:${String(el%60).padStart(2,"0")}</b>Elapsed</span><span class="stat"><b>${p>3?"~"+eta+"s":"…"}</b>Left</span><span class="stat"><b>${ids.length}</b>Clips</span></div></div>
<div class="card">${ids.map((ci,i)=>{const q=S.cp[i]||0;return`<div class="row" style="padding:5px 0"><b style="flex:1">Clip ${i+1}</b><small style="color:var(--mu)">${q>=100?"Done ✓":q>0?"Rendering "+q+"%":"Queued (0%)"}</small></div>`}).join("")}</div>
<button class="out" data-a="cancel">Cancel Rendering</button><p style="text-align:center;color:var(--mu)">Running 100% on-device</p>`}
function lib(d){const n=S.out.length;
return d?`<div class="bar"><button class="back" data-a="go" data-v="lib">←</button><div><div class="ttl">🎞 ${esc(S.title||"Your clips")}</div><small style="color:var(--mu)">${n} clip(s) from this video</small></div></div>
${n?"":'<div class="card">No clips yet.</div>'}
