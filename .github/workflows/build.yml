name: Build ClipMe APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      # Pick a llama.cpp release tag that really exists
      - name: Pick llama.cpp version
        id: tag
        run: |
          T=$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp 'refs/tags/b50*' | sed 's|.*refs/tags/||' | sort -V | head -1)
          if [ -z "$T" ]; then T=b5000; fi
          echo "Using llama.cpp tag $T"
          echo "tag=$T" >> $GITHUB_OUTPUT
      # 1) Full build with the on-device LLM engine
      - name: Build with on-device LLM
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon -PwithLlama=true -PllamaTag=${{ steps.tag.outputs.tag }} 2>&1 | tee full.log
      # 2) Fallback: app without the LLM engine
      - name: Fallback build without LLM engine
        if: steps.full.outcome == 'failure'
        run: gradle assembleDebug --no-daemon -PwithLlama=false
      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.full.outcome }}" = "success" ]; then
            echo "### Built WITH on-device LLM engine (llama.cpp ${{ steps.tag.outputs.tag }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Built WITHOUT LLM engine. Native build failed. Key error lines:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -n -i -E "CMake Error|fatal:|Could NOT|error:|No such file|not found|undefined reference|Remote branch" full.log | grep -v -E "^\s*[0-9]+:\s+at " | head -40 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ClipMe-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: full.log
