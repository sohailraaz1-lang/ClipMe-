name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the zip (first run only)
        run: |
          if [ ! -d app ] && ls ./*.zip >/dev/null 2>&1; then
            mkdir _x && unzip -q ./*.zip -d _x
            rsync -a --exclude .github _x/*/ ./
            rm -rf _x ./*.zip
            git config user.name "clipme-bot" && git config user.email "bot@users.noreply.github.com"
            git add -A && git commit -m "Unpack ClipMe" && git push
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Install app dependencies
        working-directory: app
        run: npm install

      - name: Generate the Android project
        working-directory: app
        run: npx expo prebuild --platform android

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ClipMe-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish a download link (Releases page)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk ClipMe.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ClipMe.apk --title "ClipMe (latest build)" --notes "Install ClipMe.apk on your Android phone."
